<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Crypto Portfolio</title>
<link rel="stylesheet" href="/app.css" />
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Crypto Portfolio</h1>
    <div class="status-line">
      <span id="statusPill" class="pill live"><span class="dot"></span><span id="statusText">loading</span></span>
      <span id="lastUpdated">—</span>
    </div>
  </header>

  <div class="summary" id="summary">
    <div class="stat"><div class="label">Total Value</div><div class="value" id="statValue">—</div></div>
    <div class="stat"><div class="label">Total Cost</div><div class="value" id="statCost">—</div></div>
    <div class="stat"><div class="label">P/L</div><div class="value" id="statPnl">—</div><div class="sub" id="statPnlPct"></div></div>
    <div class="stat"><div class="label">Cost Coverage</div><div class="value" id="statCoverage">—</div><div class="sub">of value has known cost</div></div>
  </div>

  <div class="warnings" id="warnings"></div>

  <section class="panel">
    <div class="panel-head">
      <h2>Holdings</h2>
      <div>
        <label for="platformFilter" style="font-size:11px;color:var(--text-dim);margin-right:6px;">Platform</label>
        <select id="platformFilter"><option value="">All</option></select>
      </div>
    </div>
    <div class="table-scroll">
      <table id="holdingsTable">
        <thead>
          <tr>
            <th data-key="symbol"><button>Asset <span class="arrow"></span></button></th>
            <th data-key="platform"><button>Platform <span class="arrow"></span></button></th>
            <th data-key="priceStatus"><button>Source <span class="arrow"></span></button></th>
            <th data-key="price"><button>Price <span class="arrow"></span></button></th>
            <th data-key="change24h"><button>24h <span class="arrow"></span></button></th>
            <th data-key="amount"><button>Amount <span class="arrow"></span></button></th>
            <th data-key="value"><button>Value <span class="arrow"></span></button></th>
            <th data-key="cost"><button>Cost <span class="arrow"></span></button></th>
            <th data-key="pnl"><button>P/L <span class="arrow"></span></button></th>
            <th data-key="pnlPct"><button>P/L % <span class="arrow"></span></button></th>
            <th data-key="weight"><button>Weight <span class="arrow"></span></button></th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </section>

  <section class="panel">
    <div class="panel-head"><h2>Accumulated P/L</h2></div>
    <div class="chart-wrap chart-container" id="chartWrap">
      <div class="chart-empty">No history yet.</div>
    </div>
  </section>

  <footer class="meta">Prices refresh lazily on the server; this page polls every 15s.</footer>
</div>

<script src="/app.js"></script>
</body>
</html>
